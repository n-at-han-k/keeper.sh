name: Publish Docker Images

# Fork build (n-at-han-k/keeper.sh). Diverges from upstream in four ways:
#
#   1. Triggers on workflow_dispatch and on push to main, not only on v*.*.*
#      tags. This fork is deployed continuously into the kremlin cluster from
#      :main, so waiting for a release tag to get an image is pointless.
#   2. The private `keeperdotsh/seo` submodule is NOT fetched. Upstream hard-
#      fails the build when KEEPER_BOT_APP_ID is unset, because their release
#      "cannot ship without content" — that content is the marketing blog,
#      changelog and docs pages. Every loader that reads it guards with
#      existsSync and returns [] (applications/web/plugins/blog.ts,
#      plugins/sitemap.ts, src/lib/changelog-content.ts), so the web image
#      builds correctly against an empty seo/ directory. A self-hosted instance
#      does not want upstream's marketing pages anyway.
#   3. The standalone/services convenience images are dropped. We run the five
#      services split out (ns/ai/manifests/keeper.rb), with Postgres from the
#      shared CNPG kremlin-db cluster and Redis from the shared valkey — the
#      convenience images bundle their own Postgres/Redis/Caddy, which would be
#      dead weight and a second, unmanaged database in the cluster.
#   4. The deploy-ec2 job is gone. It SSHed into UPSTREAM's production host
#      using EC2_HOST / EC2_SSH_KEY. We deploy via Flux from the manifests repo.
#
# Images land at ghcr.io/n-at-han-k/keeper-{api,cron,worker,mcp,web}.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: cron
            dockerfile: services/cron/Dockerfile
          - name: worker
            dockerfile: services/worker/Dockerfile
          - name: mcp
            dockerfile: services/mcp/Dockerfile
          - name: web
            dockerfile: applications/web/Dockerfile
            # Vite bakes asset URLs and import.meta.env.BASE_URL at build time,
            # so the web image is specific to the path prefix it is served
            # under. The cluster serves this instance at /keeper.
            build-args: |
              BASE_PATH=/keeper
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # submodules are deliberately not fetched — see the header note. All three
      # entries in .gitmodules point at private keeperdotsh repos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          flavor: suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.package.dockerfile }}
          build-args: ${{ matrix.package.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package.name }}-${{ matrix.arch }}

  # The per-arch builds push <tag>-amd64 / <tag>-arm64; this collapses each pair
  # into one multi-arch manifest under the bare <tag> that the Deployments pull.
  merge-manifests:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [api, cron, worker, mcp, web]
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done
